<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز رفع الصور الاحترافي - GitHub to jsDelivr</title>
<style>
  :root{
    --bg:#f7f8fc; --surface:#ffffff; --muted:#737a8c; --line:#ebedf3;
    --primary:#5b4dff; --primary-2:#7c6dff; --green:#10b981; --red:#ef4444;
    --text:#131826; --text-2:#3a4256; --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#0b0f1a; --surface:#131826; --muted:#8b93a7; --line:#1e2536;
    --primary:#7c6dff; --primary-2:#9c8fff; --green:#34d399; --red:#f87171;
    --text:#e6eaf5; --text-2:#b8c0d4;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Tahoma,sans-serif}
  body{
    background:var(--bg); color:var(--text); padding:20px; min-height:100vh;
    display:flex; justify-content:center; align-items:flex-start;
    transition:background .3s, color .3s;
  }
  .container{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:30px; width:100%; max-width:750px;
    box-shadow:0 10px 30px rgba(0,0,0,.05); margin-top: 40px;
  }
  h1{font-size:22px; margin-bottom:8px; text-align:center; color:var(--text)}
  p.subtitle{text-align:center; color:var(--muted); font-size:13px; margin-bottom:25px}

  /* Config Section */
  .config-section{
    background:var(--bg); padding:15px; border-radius:10px;
    margin-bottom:20px; border:1px dashed var(--line);
  }
  .config-header{
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; font-size:13px; font-weight:700; color:var(--primary);
  }
  .config-body{display:none; margin-top:15px; gap:10px; flex-direction:column}
  .config-body.show{display:flex}
  .input-group{display:flex; flex-direction:column; gap:5px}
  .input-group label{font-size:12px; font-weight:700; color:var(--text-2)}
  .input-group input{
    padding:10px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); color:var(--text); font-size:13px;
  }
  .input-group input:focus{outline:none; border-color:var(--primary)}
  .btn-save{
    background:var(--green); color:#fff; border:none; padding:10px; 
    border-radius:8px; font-weight:700; cursor:pointer; margin-top:5px;
  }

  /* Drop Zone */
  .drop-zone{
    border:2px dashed var(--primary); border-radius:var(--radius);
    padding:40px 20px; text-align:center; cursor:pointer;
    transition:all .2s; background:rgba(91,77,255,.03);
  }
  .drop-zone:hover, .drop-zone.dragover{
    background:rgba(91,77,255,.08); transform:scale(1.01);
  }
  .drop-zone .icon{font-size:40px; margin-bottom:10px; color:var(--primary)}
  .drop-zone .text{font-size:14px; font-weight:700; color:var(--text)}
  .drop-zone .hint{font-size:12px; color:var(--muted); margin-top:5px}

  /* Overall Progress */
  .overall-progress{
    display:none; margin-top:20px; padding:15px;
    background:var(--bg); border-radius:10px;
  }
  .progress-text{font-size:12px; font-weight:700; margin-bottom:8px; color:var(--text-2)}
  .progress-bar{
    height:6px; background:var(--line); border-radius:6px; overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--primary-2));
    transition:width .3s;
  }

  /* Results List */
  .results-container{display:none; margin-top:20px;}
  .results-title{font-size:14px; font-weight:700; margin-bottom:10px; color:var(--green); display:flex; justify-content:space-between;}
  
  .result-item{
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:12px; margin-bottom:10px; display:flex; flex-direction:column; gap:10px;
    transition:all 0.3s ease;
  }
  .result-item.error{border-color:var(--red); background:rgba(239, 68, 68, 0.05);}
  
  .result-header{display:flex; justify-content:space-between; align-items:center;}
  .result-filename{font-size:12px; font-weight:700; color:var(--text-2); direction:ltr;}
  .result-status{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;}
  .status-success{background:rgba(16, 185, 129, 0.1); color:var(--green);}
  .status-error{background:rgba(239, 68, 68, 0.1); color:var(--red);}
  
  /* Link & Image Group */
  .link-group{display:flex; gap:10px; align-items:center;}
  
  .img-preview-container {
    width: 44px; height: 44px; border-radius: 8px;
    overflow: hidden; background: var(--line);
    flex-shrink: 0; cursor: pointer; position: relative;
    border: 1px solid var(--line);
  }
  .img-preview-container img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.3s ease, filter 0.3s;
  }
  .img-preview-container:hover img {
    transform: scale(1.15);
  }
  .img-preview-container.uploading img {
    filter: blur(2px) grayscale(100%); opacity: 0.7;
  }
  
  .link-input{
    flex:1; padding:10px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); color:var(--text); font-size:13px; direction:ltr;
    width: 100%;
  }
  .btn-copy{
    background:var(--primary); color:#fff; border:none; padding:0 20px;
    border-radius:8px; cursor:pointer; font-weight:700; transition:.2s; font-size:13px;
    height: 40px; flex-shrink: 0;
  }
  .btn-copy:hover{background:var(--primary-2)}

  /* Modal for full preview */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center;
    opacity: 0; transition: opacity 0.3s ease; backdrop-filter: blur(5px);
  }
  .modal-overlay.show { display: flex; opacity: 1; }
  .modal-content {
    max-width: 90%; max-height: 90vh; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); object-fit: contain;
    transform: scale(0.95); transition: transform 0.3s ease;
  }
  .modal-overlay.show .modal-content { transform: scale(1); }
  .modal-close {
    position: absolute; top: 20px; right: 20px; color: #fff;
    font-size: 30px; cursor: pointer; background: none; border: none;
    line-height: 1; opacity: 0.7; transition: opacity 0.2s;
  }
  .modal-close:hover { opacity: 1; }

  /* Utilities */
  .theme-toggle{
    position:fixed; top:20px; left:20px; background:var(--surface);
    border:1px solid var(--line); color:var(--text); width:40px; height:40px;
    border-radius:50%; cursor:pointer; font-size:18px;
    box-shadow:0 4px 10px rgba(0,0,0,.1); z-index:100;
  }
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

<!-- Modal for Image Preview -->
<div class="modal-overlay" id="imageModal" onclick="closeModal(event)">
  <button class="modal-close" onclick="closeModal(event)">✕</button>
  <img src="" id="modalImage" class="modal-content" alt="Full Preview">
</div>

<div class="container">
  <h1>مركز رفع الصور الاحترافي</h1>
  <p class="subtitle">ارفع عدة صور، عاينها، واحصل على روابط CDN سريعة</p>

  <!-- الإعدادات -->
  <div class="config-section">
    <div class="config-header" onclick="toggleConfig()">
      <span>⚙️ إعدادات الاتصال بـ GitHub (اضغط للفتح)</span>
      <span id="configArrow">▼</span>
    </div>
    <div class="config-body" id="configBody">
      <div class="input-group">
        <label>GitHub Username (اسم المستخدم)</label>
        <input type="text" id="ghUser" placeholder="taba7es-max" dir="ltr">
      </div>
      <div class="input-group">
        <label>Repository Name (اسم المستودع)</label>
        <input type="text" id="ghRepo" placeholder="Es.TOP" dir="ltr">
      </div>
      <div class="input-group">
        <label>Branch (الفرع)</label>
        <input type="text" id="ghBranch" placeholder="main" dir="ltr" value="main">
      </div>
      <div class="input-group">
        <label>Personal Access Token (مفتاح الوصول)</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" dir="ltr">
      </div>
      <button class="btn-save" onclick="saveConfig()">حفظ الإعدادات</button>
    </div>
  </div>

  <!-- منطقة الرفع -->
  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="icon">☁️</div>
    <div class="text">اسحب الصور هنا أو اضغط للاختيار</div>
    <div class="hint">يمكنك اختيار عدة صور دفعة واحدة (حتى 5 ميجابايت للصورة)</div>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">

  <!-- شريط التحميل الكلي -->
  <div class="overall-progress" id="overallProgress">
    <div class="progress-text" id="progressText">جاري الرفع...</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- النتائج -->
  <div class="results-container" id="resultsContainer">
    <div class="results-title">
      <span>النتائج</span>
      <span id="successCount" style="color:var(--muted); font-size:12px;"></span>
    </div>
    <div id="resultsList"></div>
  </div>
</div>

<script>
  // --- Theme Handling ---
  function initTheme() {
    const saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️' : '🌙';
  }
  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  }
  initTheme();

  // --- Modal Logic ---
  function openModal(src) {
    if (!src) return;
    document.getElementById('modalImage').src = src;
    document.getElementById('imageModal').classList.add('show');
    document.body.style.overflow = 'hidden'; // Prevent scrolling
  }
  function closeModal(e) {
    if (e) e.stopPropagation();
    document.getElementById('imageModal').classList.remove('show');
    document.body.style.overflow = '';
    setTimeout(() => { document.getElementById('modalImage').src = ''; }, 300);
  }

  // --- Config Handling ---
  function toggleConfig() {
    const body = document.getElementById('configBody');
    const arrow = document.getElementById('configArrow');
    body.classList.toggle('show');
    arrow.textContent = body.classList.contains('show') ? '▲' : '▼';
  }

  function saveConfig() {
    const config = {
      user: document.getElementById('ghUser').value.trim(),
      repo: document.getElementById('ghRepo').value.trim(),
      branch: document.getElementById('ghBranch').value.trim() || 'main',
      token: document.getElementById('ghToken').value.trim()
    };
    localStorage.setItem('gh_config', JSON.stringify(config));
    alert('تم حفظ الإعدادات بنجاح!');
    toggleConfig();
  }

  function loadConfig() {
    const saved = localStorage.getItem('gh_config');
    if (saved) {
      const c = JSON.parse(saved);
      document.getElementById('ghUser').value = c.user || '';
      document.getElementById('ghRepo').value = c.repo || '';
      document.getElementById('ghBranch').value = c.branch || 'main';
      document.getElementById('ghToken').value = c.token || '';
    }
  }
  loadConfig();

  // --- Drag & Drop ---
  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });

  // --- Multi-File Upload Logic ---
  async function handleFiles(files) {
    if (!files.length) return;

    const configStr = localStorage.getItem('gh_config');
    if (!configStr) {
      alert('الرجاء إدخال إعدادات GitHub أولاً.');
      document.getElementById('configBody').classList.add('show');
      return;
    }
    const config = JSON.parse(configStr);
    if (!config.user || !config.repo || !config.token) {
      alert('بيانات الإعدادات غير مكتملة.');
      return;
    }

    // Prepare UI
    const overallProgress = document.getElementById('overallProgress');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const resultsContainer = document.getElementById('resultsContainer');
    const resultsList = document.getElementById('resultsList');
    
    overallProgress.style.display = 'block';
    resultsContainer.style.display = 'block';
    resultsList.innerHTML = ''; // Clear previous
    progressFill.style.width = '0%';

    let successCount = 0;
    const totalFiles = files.length;

    for (let i = 0; i < totalFiles; i++) {
      const file = files[i];
      
      progressText.textContent = `جاري رفع ${i + 1} من ${totalFiles}: ${file.name}`;
      
      // Create local preview URL
      const localPreviewUrl = URL.createObjectURL(file);

      // Create result item
      const itemId = `result_${Date.now()}_${i}`;
      resultsList.insertAdjacentHTML('beforeend', `
        <div class="result-item" id="${itemId}">
          <div class="result-header">
            <span class="result-filename">${file.name}</span>
            <span class="result-status" style="background:var(--line); color:var(--muted)">جاري الرفع...</span>
          </div>
          <div class="link-group" style="display:none;">
            <div class="img-preview-container uploading" onclick="openModal('${localPreviewUrl}')" title="اضغط للمعاينة">
              <img src="${localPreviewUrl}" alt="preview">
            </div>
            <input type="text" class="link-input" readonly placeholder="جاري التجهيز...">
            <button class="btn-copy" onclick="copyLink(this)" disabled style="opacity:0.5">نسخ</button>
          </div>
        </div>
      `);

      // Validate size
      if (file.size > 5 * 1024 * 1024) {
        updateItemError(itemId, 'حجم الصورة يتجاوز 5 ميجابايت');
        continue;
      }

      try {
        const base64Data = await readFileAsBase64(file);
        const ext = file.name.split('.').pop();
        const safeName = `img_${Date.now()}_${i}.${ext}`;
        const path = `images/${safeName}`;

        const apiUrl = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${path}`;
        const response = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${config.token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Upload image ${safeName}`,
            content: base64Data,
            branch: config.branch
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'فشل الرفع');
        }

        successCount++;
        const jsdelivrUrl = `https://cdn.jsdelivr.net/gh/${config.user}/${config.repo}@${config.branch}/${path}`;
        
        // Update UI on success
        updateItemSuccess(itemId, jsdelivrUrl);

      } catch (error) {
        updateItemError(itemId, error.message);
      }

      const percent = Math.round(((i + 1) / totalFiles) * 100);
      progressFill.style.width = `${percent}%`;
    }

    progressText.textContent = `اكتمل الرفع!`;
    document.getElementById('successCount').textContent = `${successCount} من ${totalFiles} بنجاح`;
    document.getElementById('fileInput').value = '';
  }

  function updateItemSuccess(itemId, url) {
    const item = document.getElementById(itemId);
    const status = item.querySelector('.result-status');
    status.textContent = 'تم الرفع ✓';
    status.className = 'result-status status-success';
    
    const linkGroup = item.querySelector('.link-group');
    linkGroup.style.display = 'flex';
    
    // Update Preview to final hosted URL (Optional, but ensures CDN works)
    const previewContainer = item.querySelector('.img-preview-container');
    const img = item.querySelector('.img-preview-container img');
    
    // Change click event to open the real URL
    previewContainer.onclick = () => openModal(url);
    previewContainer.title = 'اضغط للمعاينة الكاملة';
    
    // We replace the local blob with the real CDN link. 
    // If you want instant load, keep local blob. But to verify the CDN, we use url.
    img.src = url; 
    previewContainer.classList.remove('uploading');

    // Update Input and Button
    const input = item.querySelector('.link-input');
    input.value = url;
    
    const btn = item.querySelector('.btn-copy');
    btn.disabled = false;
    btn.style.opacity = '1';
  }

  function updateItemError(itemId, msg) {
    const item = document.getElementById(itemId);
    item.classList.add('error');
    const status = item.querySelector('.result-status');
    status.textContent = 'فشل ✕';
    status.className = 'result-status status-error';
    
    const linkGroup = item.querySelector('.link-group');
    linkGroup.style.display = 'flex';
    
    const previewContainer = item.querySelector('.img-preview-container');
    previewContainer.classList.remove('uploading');
    previewContainer.style.opacity = '0.5';
    previewContainer.onclick = null;
    
    const input = item.querySelector('.link-input');
    input.value = msg;
    input.style.color = 'var(--red)';
    
    item.querySelector('.btn-copy').style.display = 'none';
  }

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function copyLink(btn) {
    const input = btn.previousElementSibling;
    input.select();
    input.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(input.value).then(() => {
      const originalText = btn.textContent;
      btn.textContent = 'تم النسخ ✓';
      btn.style.background = 'var(--green)';
      setTimeout(() => {
        btn.textContent = originalText;
        btn.style.background = 'var(--primary)';
      }, 2000);
    });
  }
</script>
</body>
  </html>
