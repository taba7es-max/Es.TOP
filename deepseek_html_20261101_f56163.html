<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز رفع الصور - GitHub to jsDelivr</title>
<style>
  :root{
    --bg:#f7f8fc; --surface:#ffffff; --muted:#737a8c; --line:#ebedf3;
    --primary:#5b4dff; --primary-2:#7c6dff; --green:#10b981; --red:#ef4444;
    --text:#131826; --text-2:#3a4256; --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#0b0f1a; --surface:#131826; --muted:#8b93a7; --line:#1e2536;
    --primary:#7c6dff; --primary-2:#9c8fff; --green:#34d399; --red:#f87171;
    --text:#e6eaf5; --text-2:#b8c0d4;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Tahoma,sans-serif}
  body{
    background:var(--bg); color:var(--text); padding:20px; min-height:100vh;
    display:flex; justify-content:center; align-items:center;
    transition:background .3s, color .3s;
  }
  .container{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:30px; width:100%; max-width:600px;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
  }
  h1{font-size:22px; margin-bottom:8px; text-align:center; color:var(--text)}
  p.subtitle{text-align:center; color:var(--muted); font-size:13px; margin-bottom:25px}

  .config-section{
    background:var(--bg); padding:15px; border-radius:10px;
    margin-bottom:20px; border:1px dashed var(--line);
  }
  .config-header{
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; font-size:13px; font-weight:700; color:var(--primary);
  }
  .config-body{display:none; margin-top:15px; gap:10px; flex-direction:column}
  .config-body.show{display:flex}
  .input-group{display:flex; flex-direction:column; gap:5px}
  .input-group label{font-size:12px; font-weight:700; color:var(--text-2)}
  .input-group input{
    padding:10px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); color:var(--text); font-size:13px;
  }
  .input-group input:focus{outline:none; border-color:var(--primary)}

  .drop-zone{
    border:2px dashed var(--primary); border-radius:var(--radius);
    padding:40px 20px; text-align:center; cursor:pointer;
    transition:all .2s; background:rgba(91,77,255,.03);
  }
  .drop-zone:hover, .drop-zone.dragover{
    background:rgba(91,77,255,.08); transform:scale(1.01);
  }
  .drop-zone .icon{font-size:40px; margin-bottom:10px; color:var(--primary)}
  .drop-zone .text{font-size:14px; font-weight:700; color:var(--text)}
  .drop-zone .hint{font-size:12px; color:var(--muted); margin-top:5px}

  .progress-bar{
    height:4px; background:var(--line); border-radius:4px;
    margin-top:20px; overflow:hidden; display:none;
  }
  .progress-fill{
    height:100%; width:0%; background:var(--primary);
    transition:width .3s;
  }

  .result-box{
    display:none; margin-top:20px; padding:15px;
    background:var(--bg); border-radius:10px; border:1px solid var(--green);
  }
  .result-box.error{border-color:var(--red)}
  .result-title{font-size:13px; font-weight:700; margin-bottom:10px; color:var(--green)}
  .result-box.error .result-title{color:var(--red)}
  
  .link-group{display:flex; gap:8px; margin-bottom:10px}
  .link-input{
    flex:1; padding:10px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); color:var(--text); font-size:12px; direction:ltr;
  }
  .btn-copy{
    background:var(--primary); color:#fff; border:none; padding:0 15px;
    border-radius:8px; cursor:pointer; font-weight:700; transition:.2s;
  }
  .btn-copy:hover{background:var(--primary-2)}

  /* Toggle Theme */
  .theme-toggle{
    position:fixed; top:20px; left:20px; background:var(--surface);
    border:1px solid var(--line); color:var(--text); width:40px; height:40px;
    border-radius:50%; cursor:pointer; font-size:18px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
  }
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

<div class="container">
  <h1>مركز رفع الصور</h1>
  <p class="subtitle">ارفع صورتك مباشرة إلى GitHub واحصل على رابط سريع عبر jsDelivr</p>

  <!-- الإعدادات -->
  <div class="config-section">
    <div class="config-header" onclick="toggleConfig()">
      <span>⚙️ إعدادات الاتصال بـ GitHub (اضغط للفتح)</span>
      <span id="configArrow">▼</span>
    </div>
    <div class="config-body" id="configBody">
      <div class="input-group">
        <label>GitHub Username (اسم المستخدم)</label>
        <input type="text" id="ghUser" placeholder="taba7es-max" dir="ltr">
      </div>
      <div class="input-group">
        <label>Repository Name (اسم المستودع)</label>
        <input type="text" id="ghRepo" placeholder="Es.TOP" dir="ltr">
      </div>
      <div class="input-group">
        <label>Branch (الفرع)</label>
        <input type="text" id="ghBranch" placeholder="main" dir="ltr" value="main">
      </div>
      <div class="input-group">
        <label>Personal Access Token (مفتاح الوصول)</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" dir="ltr">
        <span style="font-size:11px; color:var(--muted); margin-top:3px;">
          * سيتم حفظ هذه البيانات في متصفحك فقط.
        </span>
      </div>
      <button onclick="saveConfig()" style="background:var(--green); color:#fff; border:none; padding:10px; border-radius:8px; font-weight:700; cursor:pointer; margin-top:5px;">
        حفظ الإعدادات
      </button>
    </div>
  </div>

  <!-- منطقة الرفع -->
  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="icon">☁️</div>
    <div class="text">اسحب الصورة هنا أو اضغط للاختيار</div>
    <div class="hint">PNG, JPG, WEBP - حتى 5 ميجابايت</div>
  </div>
  <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">

  <!-- شريط التحميل -->
  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- النتيجة -->
  <div class="result-box" id="resultBox">
    <div class="result-title" id="resultTitle">تم الرفع بنجاح! 🎉</div>
    <div class="link-group">
      <input type="text" class="link-input" id="finalLink" readonly>
      <button class="btn-copy" onclick="copyLink()">نسخ</button>
    </div>
    <div style="font-size:12px; color:var(--muted);" id="resultDetails"></div>
  </div>
</div>

<script>
  // --- Theme Handling ---
  function initTheme() {
    const saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️' : '🌙';
  }
  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  }
  initTheme();

  // --- Config Handling ---
  function toggleConfig() {
    const body = document.getElementById('configBody');
    const arrow = document.getElementById('configArrow');
    body.classList.toggle('show');
    arrow.textContent = body.classList.contains('show') ? '▲' : '▼';
  }

  function saveConfig() {
    const config = {
      user: document.getElementById('ghUser').value.trim(),
      repo: document.getElementById('ghRepo').value.trim(),
      branch: document.getElementById('ghBranch').value.trim() || 'main',
      token: document.getElementById('ghToken').value.trim()
    };
    localStorage.setItem('gh_config', JSON.stringify(config));
    alert('تم حفظ الإعدادات بنجاح!');
    toggleConfig();
  }

  function loadConfig() {
    const saved = localStorage.getItem('gh_config');
    if (saved) {
      const c = JSON.parse(saved);
      document.getElementById('ghUser').value = c.user || '';
      document.getElementById('ghRepo').value = c.repo || '';
      document.getElementById('ghBranch').value = c.branch || 'main';
      document.getElementById('ghToken').value = c.token || '';
    }
  }
  loadConfig();

  // --- Drag & Drop ---
  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  // --- Upload Logic ---
  async function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('الرجاء اختيار صورة صالحة'); return;
    }
    if (file.size > 5 * 1024 * 1024) {
      alert('حجم الصورة يتجاوز 5 ميجابايت'); return;
    }

    const configStr = localStorage.getItem('gh_config');
    if (!configStr) {
      alert('الرجاء إدخال إعدادات GitHub أولاً من القسم العلوي.');
      document.getElementById('configBody').classList.add('show');
      return;
    }
    const config = JSON.parse(configStr);
    if (!config.user || !config.repo || !config.token) {
      alert('بيانات الإعدادات غير مكتملة. تأكد من إدخال اسم المستخدم، المستودع، والتوكن.');
      return;
    }

    // Show progress
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const resultBox = document.getElementById('resultBox');
    progressBar.style.display = 'block';
    progressFill.style.width = '20%';
    resultBox.style.display = 'none';

    try {
      // Convert file to Base64
      const base64Data = await readFileAsBase64(file);
      progressFill.style.width = '50%';

      // Generate unique filename to avoid conflicts
      const ext = file.name.split('.').pop();
      const timestamp = Date.now();
      const safeName = `img_${timestamp}.${ext}`;
      const path = `images/${safeName}`; // Saves to an 'images' folder in repo

      // GitHub API Call
      const apiUrl = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${path}`;
      const response = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${config.token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Upload image ${safeName}`,
          content: base64Data,
          branch: config.branch
        })
      });

      progressFill.style.width = '80%';
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || 'فشل الرفع. تأكد من صحة التوكن والصلاحيات.');
      }

      // Success! Generate jsDelivr Link
      progressFill.style.width = '100%';
      const jsdelivrUrl = `https://cdn.jsdelivr.net/gh/${config.user}/${config.repo}@${config.branch}/${path}`;
      
      setTimeout(() => {
        progressBar.style.display = 'none';
        resultBox.style.display = 'block';
        resultBox.classList.remove('error');
        document.getElementById('resultTitle').textContent = 'تم الرفع بنجاح! 🎉';
        document.getElementById('finalLink').value = jsdelivrUrl;
        document.getElementById('resultDetails').innerHTML = `مسار الملف في المستودع: <code style="direction:ltr">${path}</code>`;
      }, 500);

    } catch (error) {
      progressBar.style.display = 'none';
      resultBox.style.display = 'block';
      resultBox.classList.add('error');
      document.getElementById('resultTitle').textContent = 'حدث خطأ أثناء الرفع ❌';
      document.getElementById('finalLink').value = '';
      document.getElementById('resultDetails').textContent = error.message;
    }
  }

  // Helper: File to Base64 (without the data URI prefix)
  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const base64String = reader.result.split(',')[1];
        resolve(base64String);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Copy to Clipboard
  function copyLink() {
    const linkInput = document.getElementById('finalLink');
    linkInput.select();
    linkInput.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(linkInput.value).then(() => {
      const btn = document.querySelector('.btn-copy');
      const originalText = btn.textContent;
      btn.textContent = 'تم النسخ ✓';
      btn.style.background = 'var(--green)';
      setTimeout(() => {
        btn.textContent = originalText;
        btn.style.background = 'var(--primary)';
      }, 2000);
    });
  }
</script>
</body>
</html>
